name: Helm Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  helm-lint:
    name: Helm Lint and Template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        if: hashFiles('dist/chart/Chart.yaml') != ''
        run: helm lint dist/chart

      - name: Helm template validation
        if: hashFiles('dist/chart/Chart.yaml') != ''
        run: |
          helm template smooth-operator dist/chart > /dev/null
          echo "Helm template validation passed"
