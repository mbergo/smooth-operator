name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          make build
          mkdir -p dist
          cp bin/manager dist/smooth-operator-${{ steps.version.outputs.VERSION }}-linux-amd64

      - name: Build Docker image
        run: |
          make docker-build IMG=smooth-operator:${{ steps.version.outputs.VERSION }}
          make docker-build IMG=smooth-operator:latest

      - name: Generate install manifest
        run: |
          make build-installer IMG=smooth-operator:${{ steps.version.outputs.VERSION }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smooth-operator-*
            dist/install.yaml
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          make docker-push IMG=smooth-operator:${{ steps.version.outputs.VERSION }}
          make docker-push IMG=smooth-operator:latest


