run:
  allow-parallel-runners: true
  
linters:
  disable-all: true
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

linters-settings:
  revive:
    rules:
      - name: comment-spacings
      - name: import-shadowing

issues:
  exclude-rules:
    - linters:
        - lll
      path: "api/.*"
    - linters:
        - dupl
        - lll  
      path: "internal/.*"
  exclude-dirs:
    - third_party
    - builtin
    - examples
