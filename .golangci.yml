version: "2"

run:
  allow-parallel-runners: true
  
linters:
  enable:
    - copyloopvar
    - dupl  
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
