# This rule is not used by the project smooth-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to smooth.smooth.k8s.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: smooth-operator
    app.kubernetes.io/managed-by: kustomize
  name: chatsession-viewer-role
rules:
- apiGroups:
  - smooth.smooth.k8s.io
  resources:
  - chatsessions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - smooth.smooth.k8s.io
  resources:
  - chatsessions/status
  verbs:
  - get
