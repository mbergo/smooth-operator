                - type
                x-kubernetes-list-type: map
              errors:
                description: Errors contains any error messages encountered during
                  processing
                items:
                  type: string
                type: array
              git:
                description: Git contains Git-related information after commits
                properties:
                  branch:
                    description: Branch is the Git branch name
                    type: string
                  commit:
                    description: Commit is the Git commit SHA
                    type: string
                  prURL:
                    description: PRURL is the URL of the pull request created
                    type: string
                type: object
