                  description: GeneratedArtifact represents an artifact created by
                    the operator (Helm chart, dashboard, etc.)
                  properties:
                    path:
                      description: Path is the repository path where the artifact
                        was committed
                      type: string
                    type:
                      description: Type is the kind of artifact
                      enum:
                      - helm-chart
                      - kustomize
                      - grafana-dashboard
                      type: string
                  required:
                  - path
                  - type
                  type: object
                type: array
              inferredNeeds:
                description: InferredNeeds contains the condensed plan of what the
